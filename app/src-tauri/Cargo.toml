[package]
name = "egocraft-desktop"
version = "0.4.0"
description = "EgoCraft in its own window: the same built app as the web build, no browser or Node needed."
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
